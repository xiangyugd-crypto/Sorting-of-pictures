services:
  poster-cloud:
    build: .
    container_name: poster-cloud
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      APP_SECRET: "${APP_SECRET}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      PORT: "8080"
      APP_BASE_PATH: "${APP_BASE_PATH:-}"
    volumes:
      - poster-cloud-data:/app/data

volumes:
  poster-cloud-data:
